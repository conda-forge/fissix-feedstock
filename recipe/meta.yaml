{% set name = "fissix" %}
{% set version = "26.10.29" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7e333ab27e7b6bc6aa8c9af8ca2d2695021a1b7b6063463f728370384d617faf

build:
  noarch: python
  number: 0
  script: '{{ PYTHON }} -m pip install . --no-deps --ignore-installed --no-cache-dir -vvv '

requirements:
  host:
    - flit
    - pip
    - python {{ python_min }}
  run:
    - platformdirs >=4.4.0
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - fissix
    - fissix.fixes
    - fissix.pgen2

about:
  home: https://github.com/jreese/fissix
  license: PSF-2.0
  license_family: PSF
  license_file: LICENSE
  summary: Backport of lib2to3, with enhancements

extra:
  recipe-maintainers:
    - nicoddemus
